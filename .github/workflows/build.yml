name: 🛠️ Builds
on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
env:
  SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
  SIGNPATH_ORGANIZATION_ID: ed9e5103-3fa3-4be4-8ef3-515a5ddb03f0
  SIGNPATH_PROJECT_SLUG: epic-online-services-godot
  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: windows-gdextension-dll
  # Tag builds use the production certificate once the SIGNPATH_RELEASE_SIGNING_ENABLED
  # repo variable is "true". Release signing needs manual approval in SignPath, so those
  # builds wait up to an hour. Everything else uses the self-signed test certificate.
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ (startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true') && 'release-signing' || 'test-signing' }}
  SIGNPATH_WAIT_TIMEOUT_SECONDS: ${{ (startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true') && '3600' || '600' }}
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: linux-x86-64-debug
            name: 🐧 Linux x86_64 Debug
            runner: ubuntu-24.04
            target: template_debug
            dev_build: yes
            platform: linux
            arch: x86_64
          - identifier: linux-x86-64-release
            name: 🐧Linux x86_64 Release
            runner: ubuntu-24.04
            target: template_release
            dev_build: no
            platform: linux
            arch: x86_64
          - identifier: linux-arm64-debug
            name: 🐧 Linux arm64 Debug
            runner: ubuntu-24.04-arm
            target: template_debug
            dev_build: yes
            platform: linux
            arch: arm64
          - identifier: linux-arm64-release
            name: 🐧Linux arm64 Release
            runner: ubuntu-24.04-arm
            target: template_release
            dev_build: no
            platform: linux
            arch: arm64
          - identifier: macos-debug
            name: 🍎 macOS (universal) Debug
            runner: macos-latest
            target: template_debug
            dev_build: yes
            platform: macos
            arch: universal
          - identifier: macos-release
            name: 🍎 macOS (universal) Release
            runner: macos-latest
            target: template_release
            dev_build: no
            platform: macos
            arch: universal
          - identifier: windows-debug
            name: 🏁 Windows Debug
            runner: windows-latest
            target: template_debug
            dev_build: yes
            platform: windows
            arch: x86_64
          - identifier: windows-release
            name: 🏁 Windows Release
            runner: windows-latest
            target: template_release
            dev_build: no
            platform: windows
            arch: x86_64
          - identifier: android-arm64-debug
            name: 🤖 Android arm64 Debug
            runner: ubuntu-24.04
            target: template_debug
            dev_build: yes
            platform: android
            arch: arm64
            godot_cpp_ref: "godot-4.5-stable"
          - identifier: android-arm64-release
            name: 🤖 Android arm64 Release
            runner: ubuntu-24.04
            target: template_release
            dev_build: no
            platform: android
            arch: arm64
            godot_cpp_ref: "godot-4.5-stable"
          - identifier: android-x86_64-debug
            name: 🤖 Android x86_64 Debug
            runner: ubuntu-24.04
            target: template_debug
            dev_build: yes
            platform: android
            arch: x86_64
            godot_cpp_ref: "godot-4.5-stable"
          - identifier: android-x86_64-release
            name: 🤖 Android x86_64 Release
            runner: ubuntu-24.04
            target: template_release
            dev_build: no
            platform: android
            arch: x86_64
            godot_cpp_ref: "godot-4.5-stable"
          - identifier: ios-arm64-all
            name: 🍏 iOS (arm64) All
            runner: macos-latest
            platform: ios
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up SCons
        shell: bash
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons
          scons --version

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Get godot-cpp submodule commit
        id: godot_cpp
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:godot-cpp)" >> "$GITHUB_OUTPUT"

      - name: Checkout godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          path: godot-cpp
          submodules: recursive
          ref: ${{ matrix.godot_cpp_ref || steps.godot_cpp.outputs.sha }}

      - name: Checkout private EOS SDK mirror repo
        uses: actions/checkout@v4
        with:
          token: "${{secrets.EOS_SDK_MIRROR_PAT}}"
          repository: 3ddelano/eos-sdk-mirror
          path: thirdparty/eos-sdk
          ref: "819cd0ffb3be1b28576bb9f23c502bec6c182d6b"

      - name: (Windows) Install mingw64
        if: ${{ matrix.platform == 'windows' }}
        # change to egor-tensin/setup-mingw@v2 once pr #16 is merged
        uses: 3ddelano/setup-mingw@patch-1

      - name: (Linux) Install dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqq build-essential pkg-config

      - name: (Android) Install dependencies
        if: ${{ matrix.platform == 'android' }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Setup build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache/
          key: ${{ matrix.identifier }}
          restore-keys: |
            ${{ matrix.identifier }}
        continue-on-error: true

      - name: Compile extension
        shell: sh
        if: ${{ matrix.platform != 'ios' }}
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
          SCONS_CACHE_LIMIT: 7168
        run: |
          scons target='${{ matrix.target }}' platform='${{ matrix.platform }}' arch='${{ matrix.arch }}' dev_build='${{ matrix.dev_build }}'

      - name: (iOS) Compile extension
        shell: sh
        if: ${{ matrix.platform == 'ios' }}
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
          SCONS_CACHE_LIMIT: 7168
        run: |
          chmod +x ./build-ios.sh && ./build-ios.sh

      - name: Copy extra files to addon folder
        shell: sh
        run: |
          cp -n '${{ github.workspace }}/README.md' '${{ github.workspace }}/LICENSE.md' '${{ github.workspace }}/sample/addons/epic-online-services-godot/'

      - name: Create artifact folder
        shell: sh
        run: |
          mkdir -p '${{ github.workspace }}/artifact-${{ matrix.identifier }}/${{ github.event.repository.name }}/'

      - name: Copy addons folder to artifact folder
        shell: sh
        run: |
          cp -n -r '${{ github.workspace }}/sample/addons' '${{ github.workspace }}/artifact-${{ matrix.identifier }}/${{ github.event.repository.name }}/'

      - name: (Windows) Delete compilation files
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item ${{ github.workspace }}/artifact-${{ matrix.identifier }}/${{ github.event.repository.name }}/addons/epic-online-services-godot/bin/windows/* -Include *.exp,*.lib,*.ilk -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.identifier }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/artifact-${{ matrix.identifier }}/
          compression-level: 9
          retention-days: 14

  # Code signs our own Windows DLLs (debug + release) in a single SignPath signing
  # request, then replaces them in the Windows build artifacts. Third-party DLLs
  # (EOSSDK, xaudio2) are already vendor-signed. Skipped when the API token is
  # unavailable (e.g. pull requests from forks).
  sign-windows:
    runs-on: windows-latest
    name: 🔏 Sign Windows
    needs: build
    env:
      ARTIFACT_PREFIX: ${{ github.event.repository.name }}-windows
    steps:
      - name: Download Windows build artifacts
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-*-${{ github.sha }}
          path: windows-artifacts

      - name: Collect unsigned DLLs
        id: collect
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dlls = @(Get-ChildItem windows-artifacts -Recurse -Filter 'libeosg.windows.*.dll')
          if ($dlls.Count -ne 2) { throw "Expected 2 DLLs (debug + release), found $($dlls.Count)" }
          New-Item -ItemType Directory unsigned-dlls | Out-Null
          Copy-Item $dlls.FullName unsigned-dlls/
          $pluginCfg = @(Get-ChildItem windows-artifacts -Recurse -Filter 'plugin.cfg')[0]
          $version = (Select-String -Path $pluginCfg.FullName -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $version) { throw "Could not read version from $($pluginCfg.FullName)" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned DLLs
        id: upload-unsigned
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-dlls-${{ github.sha }}
          path: unsigned-dlls/
          if-no-files-found: error
          retention-days: 1

      - name: Sign DLLs with SignPath
        id: signpath
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.collect.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_WAIT_TIMEOUT_SECONDS }}
          output-artifact-directory: signed-dlls

      - name: Replace DLLs with signed DLLs
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "Signing policy: ``$env:SIGNPATH_SIGNING_POLICY_SLUG``, [signing request](${{ steps.signpath.outputs.signing-request-web-url }})" >> $env:GITHUB_STEP_SUMMARY
          foreach ($dll in Get-ChildItem windows-artifacts -Recurse -Filter 'libeosg.windows.*.dll') {
            $signed = Join-Path signed-dlls $dll.Name
            if (-not (Test-Path $signed)) { throw "Missing signed $($dll.Name)" }
            $sig = Get-AuthenticodeSignature $signed
            if ($null -eq $sig.SignerCertificate) { throw "$($dll.Name) has no Authenticode signature" }
            Write-Host "$($dll.Name): $($sig.SignerCertificate.Subject) [$($sig.Status)] $($sig.SignerCertificate.Thumbprint)"
            "- ``$($dll.Name)``: ``$($sig.SignerCertificate.Subject)`` (status: $($sig.Status))" >> $env:GITHUB_STEP_SUMMARY
            Copy-Item $signed $dll.FullName -Force
          }

      - name: Re-upload signed Windows Debug artifact
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-debug-${{ github.sha }}
          path: windows-artifacts/${{ env.ARTIFACT_PREFIX }}-debug-${{ github.sha }}/
          if-no-files-found: error
          overwrite: true
          compression-level: 9
          retention-days: 14

      - name: Re-upload signed Windows Release artifact
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-release-${{ github.sha }}
          path: windows-artifacts/${{ env.ARTIFACT_PREFIX }}-release-${{ github.sha }}/
          if-no-files-found: error
          overwrite: true
          compression-level: 9
          retention-days: 14

  merge-platforms:
    runs-on: ubuntu-latest
    needs: [build, sign-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: linux-x86_64
            name: 🐧 Linux
            matchpattern: linux
          - identifier: macos-universal
            name: 🍎 macOS (universal)
            matchpattern: macos
          - identifier: windows
            name: 🏁 Windows
            matchpattern: windows
          - identifier: android
            name: 🤖 Android
            matchpattern: android
          - identifier: ios
            name: 🍏 iOS
            matchpattern: ios

    steps:
      - name: Merge artifacts for platform
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.matchpattern }}-${{ github.sha }}
          pattern: ${{ github.event.repository.name }}-${{ matrix.matchpattern }}*
          compression-level: 9
          retention-days: 14

  merge-all:
    runs-on: ubuntu-latest
    needs: merge-platforms
    steps:
      - name: Merge artifacts into single
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ github.event.repository.name }}-all-${{ github.sha }}
          pattern: ${{ github.event.repository.name }}-*
          compression-level: 9
          retention-days: 14

  upload-to-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: merge-all
    permissions:
      contents: write
    steps:
      - name: Download 'all' artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-all-${{ github.sha }}
          path: artifact-all
      - name: Download 'android' artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-android-${{ github.sha }}
          path: artifact-android
      - name: Download 'macos' artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos-${{ github.sha }}
          path: artifact-macos
      - name: Download 'linux' artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-linux-${{ github.sha }}
          path: artifact-linux
      - name: Download 'windows' artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-${{ github.sha }}
          path: artifact-windows
      - name: Download 'ios' artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-ios-${{ github.sha }}
          path: artifact-ios

      - name: Zip 'all' artifact
        run: |
          cd artifact-all
          zip -9 -r ../${{ github.event.repository.name }}-all-${{ github.sha }}.zip .
          cd ..
      - name: Zip 'android' artifact
        run: |
          cd artifact-android
          zip -9 -r ../${{ github.event.repository.name }}-android-${{ github.sha }}.zip .
          cd ..
      - name: Zip 'macos' artifact
        run: |
          cd artifact-macos
          zip -9 -r ../${{ github.event.repository.name }}-macos-${{ github.sha }}.zip .
          cd ..
      - name: Zip 'linux' artifact
        run: |
          cd artifact-linux
          zip -9 -r ../${{ github.event.repository.name }}-linux-${{ github.sha }}.zip .
          cd ..
      - name: Zip 'windows' artifact
        run: |
          cd artifact-windows
          zip -9 -r ../${{ github.event.repository.name }}-windows-${{ github.sha }}.zip .
          cd ..
      - name: Zip 'ios' artifact
        run: |
          cd artifact-ios
          zip -9 -r ../${{ github.event.repository.name }}-ios-${{ github.sha }}.zip .
          cd ..

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{github.event.repository.name}}-all-${{ github.sha }}.zip
            ${{github.event.repository.name}}-android-${{ github.sha }}.zip
            ${{github.event.repository.name}}-macos-${{ github.sha }}.zip
            ${{github.event.repository.name}}-linux-${{ github.sha }}.zip
            ${{github.event.repository.name}}-windows-${{ github.sha }}.zip
            ${{github.event.repository.name}}-ios-${{ github.sha }}.zip
